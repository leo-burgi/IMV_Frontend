  <main class="imv-content">

    <!-- Bienvenida -->
    <div *ngIf="app.seccionActiva === 'bienvenida'" class="imv-page">
      <div class="imv-welcome">
        <div class="imv-welcome__text">
          <h2 class="imv-page-title">Bienvenido al Portal de Gestión Interna Integral</h2>

          <p class="imv-page-sub">Avisos importantes:</p>
          <ul class="imv-notice-list" *ngIf="app.avisosImportantes.length; else sinAvisos">
            <li class="imv-notice-item" *ngFor="let aviso of app.avisosImportantes">{{ aviso }}</li>
          </ul>
          <ng-template #sinAvisos>
            <p class="imv-page-sub">No hay avisos para mostrar.</p>
          </ng-template>
        </div>
        <img src="assets/img/rafaela-logo.png" alt="Rafaela" class="imv-welcome__logo" />
      </div>

      <app-calidad-datos-panel *ngIf="app.puede('Administrativo')"
        (verAdjudicaciones)="app.cambiarSeccion('adjudicaciones')">
      </app-calidad-datos-panel>
    </div>

    <!-- Dashboard -->
    <div *ngIf="app.seccionActiva === 'home'" class="imv-page">
      <div class="imv-section-header">
        <app-dashboard (solicitarNavegacion)="app.cambiarSeccion($event)"></app-dashboard>
      </div>

    </div>

    <!-- Planes -->
    <div *ngIf="app.seccionActiva === 'consulta-integral'" class="imv-page">
      <div class="imv-card">
        <app-consulta-integral [estadoInicial]="app.consultaIntegralEstado"
          (solicitarNavegacion)="app.navegarDesdeConsulta($event)"></app-consulta-integral>
      </div>
    </div>

    <!-- Planes -->
    <div *ngIf="app.seccionActiva === 'planes'" class="imv-page">
      <div class="imv-section-header">
      </div>
      <div class="imv-card">
        <app-planes [idPlanSeleccionado]="app.idDestino('planes')"></app-planes>
      </div>
    </div>

    <!-- Barrios -->
    <div *ngIf="app.seccionActiva === 'barrios'" class="imv-page">
      <div class="imv-section-header">
      </div>
      <div class="imv-card">
        <app-barrios></app-barrios>
      </div>
    </div>

    <!-- Calles -->
    <div *ngIf="app.seccionActiva === 'calles'" class="imv-page">
      <div class="imv-section-header">
      </div>
      <div class="imv-card">
        <app-calles></app-calles>
      </div>
    </div>

    <div *ngIf="app.seccionActiva === 'personas'" class="imv-page">
      <div class="imv-card"><app-personas [idPersonaSeleccionada]="app.idDestino('personas')"
        (solicitarNavegacion)="app.navegarContextual($event)"></app-personas></div>
    </div>

    <div *ngIf="app.seccionActiva === 'adjudicaciones'" class="imv-page">
      <div class="imv-card"><app-adjudicaciones [idAdjudicacionSeleccionada]="app.idDestino('adjudicaciones')"></app-adjudicaciones></div>
    </div>

    <div *ngIf="app.seccionActiva === 'propiedades'" class="imv-page">
      <div class="imv-card"><app-propiedades [idPropiedadSeleccionada]="app.idDestino('propiedades')"
        (solicitarNavegacion)="app.navegarContextual($event)"></app-propiedades></div>
    </div>

    <div *ngIf="app.seccionActiva === 'notariales'" class="imv-page">
      <div class="imv-card"><app-notariales></app-notariales></div>
    </div>

  </main>
