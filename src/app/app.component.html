<!-- ═══════════════════════════════════════════════════════
     TOPBAR
════════════════════════════════════════════════════════ -->
<div class="imv-topbar">
  <div class="imv-topbar__inner">

    <div class="imv-topbar__search">
      <form (submit)="buscar(searchInput.value); $event.preventDefault();">
        <div class="imv-search-wrapper">
          <i class="fas fa-search imv-search-icon"></i>
          <input
            #searchInput
            type="search"
            class="imv-search-input"
            placeholder="¿Qué estás buscando?"
            aria-label="Buscar sección"
            (keyup.enter)="buscar(searchInput.value)"
          />
        </div>
      </form>
    </div>

    <div class="imv-topbar__user">
      <div class="imv-avatar" aria-hidden="true">AD</div>
      <span class="imv-user-name">Administrador</span>
    </div>

  </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     LAYOUT PRINCIPAL
════════════════════════════════════════════════════════ -->
<div class="imv-layout" [class.sidebar-collapsed]="sidebarCollapsed">

  <!-- ── SIDEBAR ── -->
  <nav class="imv-sidebar" [class.imv-sidebar--collapsed]="sidebarCollapsed">

    <div class="imv-nav-item" [class.imv-nav-item--active]="seccionActiva === 'bienvenida'"  
    (click)="cambiarSeccion('bienvenida')" title="Inicio">
      <div class="imv-logo-box" >
        <img src="assets/img/IMV-sinfondo.png" alt="IMV Rafaela" class="imv-logo-img" />
      </div>
      <div class="imv-logo-text" *ngIf="!sidebarCollapsed">
        <strong>Inicio</strong>
        <span>Portal de Gestión v1.1</span>
      </div>
    </div>

    <div class="imv-sidebar__nav">

      <a class="imv-nav-item" [class.imv-nav-item--active]="seccionActiva === 'home'"
         (click)="cambiarSeccion('home')" title="Dashboard">
        <i class="fas fa-fw fa-th-large imv-nav-icon"></i>
        <span class="imv-nav-label">Dashboard</span>
      </a>

      <a class="imv-nav-item" [class.imv-nav-item--active]="seccionActiva === 'consulta-integral'"
         (click)="cambiarSeccion('consulta-integral')" title="Consulta integral">
        <i class="fas fa-fw fa-search-location imv-nav-icon"></i>
        <span class="imv-nav-label">Consulta integral</span>
      </a>

      <a class="imv-nav-item" [class.imv-nav-item--active]="seccionActiva === 'planes'"
         (click)="cambiarSeccion('planes')" title="Planes">
        <i class="fas fa-fw fa-clipboard-list imv-nav-icon"></i>
        <span class="imv-nav-label">Planes</span>
      </a>

      <a class="imv-nav-item" [class.imv-nav-item--active]="seccionActiva === 'barrios'"
         (click)="cambiarSeccion('barrios')" title="Barrios">
        <i class="fas fa-fw fa-map-marked-alt imv-nav-icon"></i>
        <span class="imv-nav-label">Barrios</span>
      </a>

      <a class="imv-nav-item" [class.imv-nav-item--active]="seccionActiva === 'calles'"
         (click)="cambiarSeccion('calles')" title="Calles">
        <i class="fas fa-fw fa-road imv-nav-icon"></i>
        <span class="imv-nav-label">Calles</span>
      </a>

      <a class="imv-nav-item" [class.imv-nav-item--active]="seccionActiva === 'personas'"
         (click)="cambiarSeccion('personas')" title="Personas">
        <i class="fas fa-fw fa-user-tie imv-nav-icon"></i>
        <span class="imv-nav-label">Personas</span>
      </a>

      <a class="imv-nav-item" [class.imv-nav-item--active]="seccionActiva === 'adjudicaciones'"
         (click)="cambiarSeccion('adjudicaciones')" title="Adjudicaciones">
        <i class="fas fa-fw fa-key imv-nav-icon"></i>
        <span class="imv-nav-label">Adjudicaciones</span>
      </a>

      <a class="imv-nav-item" [class.imv-nav-item--active]="seccionActiva === 'propiedades'"
         (click)="cambiarSeccion('propiedades')" title="Propiedades">
        <i class="fas fa-fw fa-home imv-nav-icon"></i>
        <span class="imv-nav-label">Propiedades</span>
      </a>

      <a class="imv-nav-item" [class.imv-nav-item--active]="seccionActiva === 'notariales'"
         (click)="cambiarSeccion('notariales')" title="Notariales">
        <i class="fas fa-fw fa-file-signature imv-nav-icon"></i>
        <span class="imv-nav-label">Notariales</span>
      </a>

      <a class="imv-nav-item imv-nav-item--disabled" title="Próximamente">
        <i class="fas fa-fw fa-handshake imv-nav-icon"></i>
        <span class="imv-nav-label">Convenios</span>
      </a>

      <a class="imv-nav-item imv-nav-item--disabled" title="Próximamente">
        <i class="fas fa-fw fa-tools imv-nav-icon"></i>
        <span class="imv-nav-label">Área Técnica</span>
      </a>

    </div>

    <button class="imv-sidebar__toggle" (click)="toggleSidebar()"
            [title]="sidebarCollapsed ? 'Expandir menú' : 'Colapsar menú'"
            type="button">
      <i class="fas" [ngClass]="sidebarCollapsed ? 'fa-angle-right' : 'fa-angle-left'"></i>
    </button>

  </nav>

  <!-- ── CONTENIDO ── -->
  <main class="imv-content">

    <!-- Bienvenida -->
    <div *ngIf="seccionActiva === 'bienvenida'" class="imv-page">
      <div class="imv-welcome">
        <div class="imv-welcome__text">
          <h2 class="imv-page-title">Bienvenido al Portal de Gestión Interna Integral</h2>

          <p class="imv-page-sub">Avisos importantes:</p>
          <ul class="imv-notice-list" *ngIf="avisosImportantes.length; else sinAvisos">
            <li class="imv-notice-item" *ngFor="let aviso of avisosImportantes">{{ aviso }}</li>
          </ul>
          <ng-template #sinAvisos>
            <p class="imv-page-sub">No hay avisos para mostrar.</p>
          </ng-template>
        </div>
        <img src="assets/img/rafaela-logo.png" alt="Rafaela" class="imv-welcome__logo" />
      </div>

      <app-calidad-datos-panel
        (verAdjudicaciones)="cambiarSeccion('adjudicaciones')">
      </app-calidad-datos-panel>
    </div>

    <!-- Dashboard -->
    <div *ngIf="seccionActiva === 'home'" class="imv-page">
      <div class="imv-section-header">
        <app-dashboard (solicitarNavegacion)="cambiarSeccion($event)"></app-dashboard>
      </div>
      
    </div>

    <!-- Planes -->
    <div *ngIf="seccionActiva === 'consulta-integral'" class="imv-page">
      <div class="imv-card">
        <app-consulta-integral [estadoInicial]="consultaIntegralEstado"
          (solicitarNavegacion)="navegarDesdeConsulta($event)"></app-consulta-integral>
      </div>
    </div>

    <!-- Planes -->
    <div *ngIf="seccionActiva === 'planes'" class="imv-page">
      <div class="imv-section-header">
      </div>
      <div class="imv-card">
        <app-planes [idPlanSeleccionado]="idDestino('planes')"></app-planes>
      </div>
    </div>

    <!-- Barrios -->
    <div *ngIf="seccionActiva === 'barrios'" class="imv-page">
      <div class="imv-section-header">
      </div>
      <div class="imv-card">
        <app-barrios></app-barrios>
      </div>
    </div>

    <!-- Calles -->
    <div *ngIf="seccionActiva === 'calles'" class="imv-page">
      <div class="imv-section-header">
      </div>
      <div class="imv-card">
        <app-calles></app-calles>
      </div>
    </div>

    <div *ngIf="seccionActiva === 'personas'" class="imv-page">
      <div class="imv-card"><app-personas [idPersonaSeleccionada]="idDestino('personas')"></app-personas></div>
    </div>

    <div *ngIf="seccionActiva === 'adjudicaciones'" class="imv-page">
      <div class="imv-card"><app-adjudicaciones [idAdjudicacionSeleccionada]="idDestino('adjudicaciones')"></app-adjudicaciones></div>
    </div>

    <div *ngIf="seccionActiva === 'propiedades'" class="imv-page">
      <div class="imv-card"><app-propiedades [idPropiedadSeleccionada]="idDestino('propiedades')"></app-propiedades></div>
    </div>

    <div *ngIf="seccionActiva === 'notariales'" class="imv-page">
      <div class="imv-card"><app-notariales></app-notariales></div>
    </div>

  </main>
</div>
