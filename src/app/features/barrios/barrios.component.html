<div class="table-responsive">
    <table class="table table-hover" id="dataTableBarrios" width="100%" cellspacing="0">
        <thead class="thead-light">
            <tr>
                <th>ID</th>
                <th>Nombre del Barrio</th>
                <th class="text-center">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let barrio of listaBarrios">
                <td>
                    <span class="badge badge-secondary">#{{ barrio.IdBarrio }}</span>
                </td>
                <td class="font-weight-bold">{{ barrio.Nombre }}</td>
                <td class="text-center">
                    <button class="btn btn-info btn-sm mr-1" (click)="verDetalle(barrio)">
                        <i class="fas fa-eye"></i>
                    </button>
                    <button class="btn btn-warning btn-sm" (click)="editarBarrio(barrio)" title="Editar">
                        <i class="fas fa-edit text-white"></i>
                    </button>
                </td>
            </tr>

            <!-- Mensaje de carga si el array está vacío -->
            <tr *ngIf="listaBarrios.length === 0">
                <td colspan="3" class="text-center text-muted py-4">
                    <i class="fas fa-spinner fa-spin mr-2"></i> Cargando barrios desde el servidor IMV...
                </td>
            </tr>
        </tbody>
    </table>
</div>
