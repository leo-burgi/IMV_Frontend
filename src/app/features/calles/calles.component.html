<div class="table-responsive">
  <table class="table table-hover" id="dataTable" width="100%" cellspacing="0">
    <thead class="thead-light">
      <tr>
        <th>ID</th>
        <th>Abreviatura</th>
        <th>Nombre</th>
        <th class="text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let calle of listarCalles">
        <td><span class="badge badge-secondary">#{{ calle.IdCalle }}</span></td>
        <td class="font-weight-bold">{{ calle.NombreCalle }}</td>
        <td>{{ calle.NombreReducido }}</td>
        <td class="text-center">
          <button class="btn btn-info btn-sm mr-1" (click)="verDetalle(calle)">
            <i class="fas fa-eye"></i>
          </button>
          <button class="btn btn-warning btn-sm" (click)="editarCalle(calle)" title="Editar">
            <i class="fas fa-edit text-white"></i>
          </button>
        </td>
      </tr>
      <tr *ngIf="listarCalles.length === 0">
        <td colspan="4" class="text-center text-muted py-4">
          <i class="fas fa-spinner fa-spin mr-2"></i> Cargando datos desde el servidor IMV...
        </td>
      </tr>
    </tbody>
  </table>
</div>
